note: >-
  H1 publishes NO first-party client libraries for the H1 Provider Data API (formerly Ribbon Health API).
  The GitHub organizations that belong to H1 (github.com/h1insights) and the acquired brand
  (github.com/ribbonhealth) both exist but carry zero public repositories. The documentation offers
  copy-paste request samples (Shell, Node, Ruby, PHP, Python) generated by the ReadMe docs platform rather
  than packaged SDKs. Everything listed below is third-party and community-maintained; none is endorsed by
  H1, and no `SDKs` pointer is asserted in apis.yml as a result.

