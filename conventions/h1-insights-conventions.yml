rate_limiting:
  documented: false
  headers: null
  note: >-
    No rate-limit policy, quota or 429 response is documented in the API docs or declared in the OpenAPI
    (no 429 appears among the 75 operations). Latency guidance is published instead of throughput limits.

data_quality_signals:
  confidence_scores:
    scale: 1-5
    meaning:
      '5': manually verified within the past 90 days
      '4': ~90% probability of accuracy
      '3': ~70% probability of accuracy
      '2': ~50% probability of accuracy (stated industry average)
      '1': ~20% probability of accuracy
    applies_to: provider contact information (address, phone number)
    docs: https://ribbon.readme.io/docs/confidence-scores
    note: >-
      A first-class response-level trust signal — unusual for a directory API and directly consumable by
      agents deciding whether to act on a returned address or phone number.

