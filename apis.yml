aid: h1-insights
name: H1
description: >-
  H1 is a healthcare data and intelligence company that builds a unified view of the world's healthcare
  providers — physicians, care locations, organizations, insurance networks, specialties, clinical focus
  areas, negotiated prices and quality signals — and makes it available to pharmaceutical, life-science,
  health-plan and digital-health customers through applications and a REST API. Following its acquisition
  of Ribbon Health (announced January 2025) the provider-data platform is delivered as "H1 for Health Plans
  and Digital Health", and the developer-facing product is the H1 Provider Data API (still served from the
  api.ribbonhealth.com host and documented at ribbon.readme.io). The API covers provider directory search
  by geography, insurance network, specialty, procedure and quality measure; location and organization
  search; reference data for insurances, specialties, provider types, location types, procedures,
  languages, conditions and treatments; customer-specific custom directories, custom fields and
  boost/custom ranking filters; price-transparency search over negotiated rates; procedure cost estimates;
  and real-time member eligibility and benefits checks. H1 states it serves 200+ customers across six
  continents, including a majority of the top-20 pharmaceutical companies and most major US health plans.
