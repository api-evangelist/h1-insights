apis:
- name: H1 Provider Data API
  description: >-
    REST API (formerly the Ribbon Health API) for searching and enriching United States healthcare
    provider, location and organization data — including insurance network participation, specialties,
    clinical focus areas, confidence scores, cost/quality measures, negotiated price transparency,
    procedure cost estimates and real-time member eligibility. Bearer-token authenticated, JSON over
    HTTPS, versioned in the URI path (/v1), with customer-scoped "custom" directories that can be edited
    and extended with custom fields and search filters.
  humanURL: https://ribbon.readme.io/
  baseURL: https://api.ribbonhealth.com/v1
