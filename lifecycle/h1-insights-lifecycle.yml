corporate_lifecycle:
  note: >-
    H1 acquired Ribbon Health (deal announced 2026-01 style reporting of January 2025; closed December
    2024) and folded the platform in as "H1 for Health Plans and Digital Health". The API host
    (api.ribbonhealth.com), docs host (ribbon.readme.io), status page (status.ribbonhealth.com) and the
    OpenAPI info.title ("Ribbon Health API") all still carry the acquired brand, while the docs content,
    support address (support@h1.co) and signup flow have been rebranded to H1. H1 also acquired Veda.
  sources:
  - https://h1.co/press/h1-acquires-veda-to-solve-healthcares-provider-data-challenge-and-power-better-care/
  - https://www.fiercehealthcare.com/health-tech/h1-acquires-ribbon-health-expand-its-reach-health-plan-digital-health-markets
