authorization_model:
  style: account-package entitlement
  scopes: false
  note: >-
    There is no scope, permission or consent surface. What an authenticated caller may do is determined by
    the account's contracted package. Calls outside the package return 403 permission_denied with an
    explanatory message (for example "Trial accounts do not have access to custom provider directories",
    "This resource is managed by Ribbon and cannot be modified"). An agent cannot narrow its own
    privileges on this API — the token is all-or-nothing within the account's entitlement.
  add_on_gated_surfaces:
